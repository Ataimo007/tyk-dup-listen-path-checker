[project]
name = "tyk-dup-listen-path-checker"
version = "0.1.0"
description = "CLI that flags Tyk APIs sharing the same (domain, listen_path), so teams without MCP tooling can still catch routing collisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
]

[project.scripts]
tyk-dup-check = "tyk_dup_checker.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tyk_dup_checker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
